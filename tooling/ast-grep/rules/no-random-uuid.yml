id: no-random-uuid
language: TypeScript
severity: error
message: Persistent identities must use the foundation uuidv7() helper, not crypto.randomUUID().
files:
  - apps/**/*.ts
  - apps/**/*.tsx
  - framework/**/*.ts
  - framework/**/*.tsx
  - erp/**/*.ts
  - erp/**/*.tsx
  - extensions/**/*.ts
  - extensions/**/*.tsx
  - tests/**/*.ts
  - tests/**/*.tsx
  - tooling/**/*.ts
  - tooling/**/*.tsx
ignores:
  - erp/modules/process/src/postgres.ts
rule:
  pattern: crypto.randomUUID()
