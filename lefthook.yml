# Requires Lefthook v2.1.11+
assert_lefthook_installed: true

pre-commit:
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: pnpm exec dprint fmt {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional:
      run: pnpm exec tsx tooling/check-commit-message.ts {1}
