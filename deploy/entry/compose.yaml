name: ritsei-entry

services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_DB: ritsei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ritsei"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ritsei-entry-postgres:/var/lib/postgresql/data

  migrate:
    image: node:24-slim
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ritsei
      RITSEI_DEPLOYMENT_PROFILE: entry
      RITSEI_FINANCIAL_AUTHORITY: postgresql
    volumes:
      - ../..:/app
    command: ["pnpm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: node:24-slim
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ritsei
      RITSEI_DEPLOYMENT_PROFILE: entry
      RITSEI_FINANCIAL_AUTHORITY: postgresql
      RITSEI_AUTH_PROFILE: transitional-local
      RITSEI_TRANSITIONAL_USER_ACCOUNT_EMAIL: admin@example.test
      PORT: "8000"
    volumes:
      - ../..:/app
    command: ["pnpm", "start"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: node:24-slim
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ritsei
      RITSEI_DEPLOYMENT_PROFILE: entry
      RITSEI_FINANCIAL_AUTHORITY: postgresql
      RITSEI_AUTH_PROFILE: transitional-local
      RITSEI_TRANSITIONAL_USER_ACCOUNT_EMAIL: admin@example.test
      WORKER_TENANT_ID: 00000000-0000-4000-8000-000000000001
      WORKER_ID: entry-accounting-worker
    volumes:
      - ../..:/app
    command: ["pnpm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  ritsei-entry-postgres:
