name: ritsei-entry

services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_DB: ritsei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ritsei"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ritsei-entry-postgres:/var/lib/postgresql/data

  migrate:
    image: node:24-slim
    working_dir: /app
    environment:
      DATABASE_URL: ${RITSEI_ENTRY_DATABASE_URL}
      RITSEI_DEPLOYMENT_PROFILE: ${RITSEI_DEPLOYMENT_PROFILE}
      RITSEI_FINANCIAL_AUTHORITY: ${RITSEI_FINANCIAL_AUTHORITY}
    volumes:
      - ../..:/app
    command: ["pnpm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: node:24-slim
    working_dir: /app
    environment:
      DATABASE_URL: ${RITSEI_ENTRY_DATABASE_URL}
      RITSEI_DEPLOYMENT_PROFILE: ${RITSEI_DEPLOYMENT_PROFILE}
      RITSEI_FINANCIAL_AUTHORITY: ${RITSEI_FINANCIAL_AUTHORITY}
      RITSEI_AUTH_PROFILE: ${RITSEI_AUTH_PROFILE}
      RITSEI_TRANSITIONAL_USER_ACCOUNT_EMAIL: ${RITSEI_TRANSITIONAL_USER_ACCOUNT_EMAIL}
      PORT: ${PORT}
    volumes:
      - ../..:/app
    command: ["pnpm", "start"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: node:24-slim
    working_dir: /app
    environment:
      DATABASE_URL: ${RITSEI_ENTRY_DATABASE_URL}
      RITSEI_DEPLOYMENT_PROFILE: ${RITSEI_DEPLOYMENT_PROFILE}
      RITSEI_FINANCIAL_AUTHORITY: ${RITSEI_FINANCIAL_AUTHORITY}
      RITSEI_AUTH_PROFILE: ${RITSEI_AUTH_PROFILE}
      RITSEI_TRANSITIONAL_USER_ACCOUNT_EMAIL: ${RITSEI_TRANSITIONAL_USER_ACCOUNT_EMAIL}
      WORKER_TENANT_ID: ${WORKER_TENANT_ID}
      WORKER_ID: ${RITSEI_ENTRY_WORKER_ID}
    volumes:
      - ../..:/app
    command: ["pnpm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  ritsei-entry-postgres:
