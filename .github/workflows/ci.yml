name: CI

# Pull requests run once on the pull_request event; branch pushes other than main are covered by it.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same pull request cancels the run it replaces; main runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Varlock environment
        run: pnpm exec varlock load --agent

      - name: Commit and PR message validation
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Skipping commit-range validation for tag push."
          elif [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial branch push; the pull request check will validate its full commit range."
          else
            pnpm exec tsx tooling/check-commit-range.ts "$BASE_SHA" "$HEAD_SHA"
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
            pnpm exec tsx tooling/check-commit-message.ts "$RUNNER_TEMP/pr-title"
          fi

      - name: Format
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Drizzle migration graph
        run: pnpm run db:check

      - name: Agent skills
        run: pnpm run skills:check

      - name: Boundary tests
        run: pnpm run boundary:test

      - name: Boundary lint
        run: pnpm run boundary:lint

      - name: Fallow audit
        run: pnpm run fallow:audit

  # The suite is split into two repository shards and the browser project, which alone needs
  # Chromium and the shared web build.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repository 1/2
            args: --project repository --shard=1/2
            browser: false
          - name: repository 2/2
            args: --project repository --shard=2/2
            browser: false
          - name: frontend
            args: --project frontend
            browser: true
    services:
      postgres:
        image: postgres:19rc1-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ritsei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ritsei"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ritsei
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: matrix.browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: matrix.browser && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: matrix.browser && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Generate contracts and styles
        run: pnpm run contracts && pnpm run styles

      - name: Tests
        run: pnpm exec varlock run -- vitest run ${{ matrix.args }}

  nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check --all-systems
