name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Commit and PR message validation
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Skipping commit-range validation for tag push."
          elif [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial branch push; the pull request check will validate its full commit range."
          else
            pnpm exec tsx tooling/check-commit-range.ts "$BASE_SHA" "$HEAD_SHA"
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
            pnpm exec tsx tooling/check-commit-message.ts "$RUNNER_TEMP/pr-title"
          fi

      - name: Format
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Drizzle migration graph
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ritsei
        run: pnpm run db:check

      - name: Roadmap measurement
        run: pnpm run roadmap:measure

      - name: Agent skills
        run: pnpm run skills:check

      - name: Boundary tests
        run: pnpm run boundary:test

      - name: Boundary lint
        run: pnpm run boundary:lint

      - name: Tests
        run: pnpm run test

      - name: Fallow audit
        run: pnpm run fallow:audit

  nix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check --all-systems
